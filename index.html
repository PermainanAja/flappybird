<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Terbang ke 10m — Ulang Tahun Selya</title>
<style>
  :root{
    --sky-top:#7EC8E3;
    --sky-bot:#CDEAF0;
    --ground:#DEB887;
    --ground-dark:#B8935E;
    --pipe:#5CB85C;
    --pipe-dark:#3F8F3F;
    --ink:#22313A;
    --cream:#FFF8EC;
    --gold:#E7B85E;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:#123;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#0d1b22;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }
  #gameContainer{
    position:relative;
    width:100%;max-width:480px;height:100%;max-height:800px;
    background:linear-gradient(var(--sky-top),var(--sky-bot));
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  canvas{display:block;width:100%;height:100%;}

  #topBar{
    position:absolute;top:calc(14px + env(safe-area-inset-top,0));left:0;right:0;
    display:flex;justify-content:center;pointer-events:none;z-index:5;
  }
  #scoreDisplay{
    background:rgba(34,49,58,.55);
    color:#fff;padding:8px 18px;border-radius:20px;
    font-size:18px;font-weight:700;letter-spacing:.5px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }

  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;z-index:10;
    background:rgba(20,30,36,.55);
    color:#fff;
  }
  .hidden{display:none !important;}

  .card{
    background:var(--cream);color:var(--ink);
    border-radius:18px;padding:28px 26px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    max-width:320px;
  }
  .card h1{margin:0 0 6px;font-size:26px;color:#2E5339;}
  .card p{margin:6px 0 18px;font-size:15px;line-height:1.5;color:#4a5b56;}
  .btn{
    display:inline-block;border:none;cursor:pointer;
    background:linear-gradient(180deg,#6FCB6F,#3F8F3F);
    color:#fff;font-size:17px;font-weight:700;
    padding:12px 28px;border-radius:30px;
    box-shadow:0 4px 0 #2d6b2d, 0 6px 14px rgba(0,0,0,.25);
    transition:transform .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2d6b2d;}

  #winScreen h2{
    font-size:30px;background:var(--cream);color:#B8892B;
    padding:18px 22px;border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    animation:pop .35s ease;
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  #flapBtn{
    position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0));
    transform:translateX(-50%);
    width:78px;height:78px;border-radius:50%;
    border:none;cursor:pointer;z-index:6;
    background:radial-gradient(circle at 32% 28%, #FFE9A8, #FFC93C 55%, #E7A315 100%);
    box-shadow:0 6px 0 #B87A0B, 0 10px 18px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
  }
  #flapBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #B87A0B, 0 4px 10px rgba(0,0,0,.3);}
  #flapBtn.hidden{display:none;}

  /* ===== Celebration screen ===== */
  #celebration{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
    background:linear-gradient(135deg,#FF6FA5,#FFC93C,#6FCBFF,#B36FFF);
    background-size:400% 400%;
    animation:bgshift 10s ease infinite;
  }
  @keyframes bgshift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  #confettiCanvas{position:absolute;inset:0;width:100%;height:100%;}

  #banner{
    position:relative;z-index:2;
    font-size:clamp(22px,7vw,40px);
    font-weight:800;color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,.2);
    background:rgba(255,255,255,.18);
    border:3px solid rgba(255,255,255,.6);
    padding:14px 26px;border-radius:16px;
    margin-bottom:18px;text-align:center;
    animation:wobble 1.6s ease-in-out infinite;
  }
  @keyframes wobble{
    0%,100%{transform:rotate(-1.5deg)}
    50%{transform:rotate(1.5deg)}
  }

  #cakeWrap{position:relative;z-index:2;width:260px;height:230px;}
  .plate{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:240px;height:18px;border-radius:50%;
    background:radial-gradient(ellipse at center, #fff, #e2d6ff);
    box-shadow:0 6px 12px rgba(0,0,0,.25);
  }
  .tier{
    position:absolute;left:50%;transform:translateX(-50%);
    border-radius:8px;
    box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);
  }
  .tier1{bottom:14px;width:210px;height:60px;background:#F7B4CC;}
  .tier2{bottom:66px;width:160px;height:52px;background:#FFD9A0;}
  .tier3{bottom:110px;width:110px;height:44px;background:#B7E4C7;}
  .drip{
    position:absolute;left:50%;transform:translateX(-50%);
    width:210px;height:16px;
    background:repeating-linear-gradient(90deg,#fff 0 14px, transparent 14px 28px);
    border-radius:0 0 10px 10px;
  }
  .drip1{bottom:66px;width:210px;}
  .drip2{bottom:110px;width:160px;}
  .sprinkle{
    position:absolute;width:6px;height:6px;border-radius:50%;
  }
  .candle{
    position:absolute;bottom:154px;width:7px;height:34px;
    border-radius:3px;
    background:repeating-linear-gradient(180deg,#fff 0 6px, #FF6FA5 6px 12px);
  }
  .flame{
    position:absolute;bottom:186px;width:10px;height:16px;
    left:50%;transform:translateX(-50%);
    background:radial-gradient(ellipse at bottom, #FFF3B0 0%, #FFA83C 55%, #FF5E2E 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation:flicker .5s ease-in-out infinite alternate;
    box-shadow:0 0 8px 2px rgba(255,170,60,.8);
  }
  @keyframes flicker{
    from{transform:translateX(-50%) scale(1) rotate(-3deg);}
    to{transform:translateX(-50%) scale(1.15,1.3) rotate(3deg);}
  }
  #againBtn{
    margin-top:20px;position:relative;z-index:2;
    background:#fff;color:#B36FFF;border:none;
    padding:10px 22px;border-radius:24px;
    font-weight:800;font-size:15px;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
</style>
</head>
<body>

<div id="stage">
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="topBar"><div id="scoreDisplay">0 m / 200 m</div></div>

    <div id="startScreen" class="overlay">
      <div class="card">
        <h1>🐤 Terbang ke 200m</h1>
        <p>Tekan tombol bulat di bawah untuk membuat burung terbang. Lewati semua pilar sampai 200 meter untuk membuka kejutan ulang tahun!</p>
        <button class="btn" id="startBtn">Mulai Terbang</button>
      </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="card">
        <h1>💥 Oh tidak!</h1>
        <p id="goStats">Burung menabrak. Coba lagi ya!</p>
        <button class="btn" id="retryBtn">Coba Lagi</button>
      </div>
    </div>

    <div id="winScreen" class="overlay hidden">
      <h2>🎉 Selamat Anda menang 🎉</h2>
    </div>

    <button id="flapBtn" aria-label="Terbang">🐤</button>
  </div>
</div>

<div id="celebration" class="hidden">
  <canvas id="confettiCanvas"></canvas>
  <div id="banner">🎂 Happy Birthday Selya 🎂</div>
  <div id="cakeWrap">
    <div class="plate"></div>
    <div class="tier tier1"></div>
    <div class="drip drip1"></div>
    <div class="tier tier2"></div>
    <div class="drip drip2"></div>
    <div class="tier tier3"></div>
    <div class="candle" style="left:35%;"></div>
    <div class="candle" style="left:50%;"></div>
    <div class="candle" style="left:65%;"></div>
    <div class="flame" style="left:35%;"></div>
    <div class="flame" style="left:50%;"></div>
    <div class="flame" style="left:65%;"></div>
  </div>
  <button id="againBtn">Main Lagi</button>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Audio (synth, no external files) ---------- */
  var actx = null;
  function audio(){
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(actx.state === "suspended") actx.resume();
    return actx;
  }

  function playFlap(){
    try{
      var ctx = audio();
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(320, t0);
      osc.frequency.exponentialRampToValueAtTime(140, t0 + 0.12);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.15);
    }catch(e){}
  }

  function playHit(){
    try{
      var ctx = audio();
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(180, t0);
      osc.frequency.exponentialRampToValueAtTime(40, t0 + 0.3);
      gain.gain.setValueAtTime(0.3, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.32);
    }catch(e){}
  }

  function playScore(){
    try{
      var ctx = audio();
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(880, t0);
      gain.gain.setValueAtTime(0.12, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.1);
    }catch(e){}
  }

  // Happy Birthday melody: [note, beats]  (0 = rest)
  var HBD_NOTES = [
    ["C4",0.75],["C4",0.25],["D4",1],["C4",1],["F4",1],["E4",2],
    ["C4",0.75],["C4",0.25],["D4",1],["C4",1],["G4",1],["F4",2],
    ["C4",0.75],["C4",0.25],["C5",1],["A4",1],["F4",1],["E4",1],["D4",2],
    ["A#4",0.75],["A#4",0.25],["A4",1],["F4",1],["G4",1],["F4",2]
  ];
  var NOTE_FREQ = {
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00,
    A4:440.00, "A#4":466.16, C5:523.25
  };
  function playHBD(){
    try{
      var ctx = audio();
      var t = ctx.currentTime + 0.1;
      var beat = 0.34;
      HBD_NOTES.forEach(function(n){
        var freq = NOTE_FREQ[n[0]];
        var dur = n[1]*beat;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur*0.95);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
        t += dur;
      });
    }catch(e){}
  }

  /* ---------- Game setup ---------- */
  var container = document.getElementById("gameContainer");
  var canvas = document.getElementById("gameCanvas");
  var ctx2d = canvas.getContext("2d");
  var scoreDisplay = document.getElementById("scoreDisplay");
  var startScreen = document.getElementById("startScreen");
  var gameOverScreen = document.getElementById("gameOverScreen");
  var goStats = document.getElementById("goStats");
  var winScreen = document.getElementById("winScreen");
  var flapBtn = document.getElementById("flapBtn");
  var startBtn = document.getElementById("startBtn");
  var retryBtn = document.getElementById("retryBtn");
  var celebration = document.getElementById("celebration");
  var againBtn = document.getElementById("againBtn");
  var confettiCanvas = document.getElementById("confettiCanvas");
  var cctx = confettiCanvas.getContext("2d");

  var W, H, DPR;
  function resize(){
    var rect = container.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx2d.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener("resize", resize);

  var TOTAL_PILLARS = 10;
  var GAP = 168;
  var PIPE_W = 62;
  var PIPE_SPACING = 300;
  var GROUND_H = 64;
  var GRAVITY = 1500;      // px/s^2
  var FLAP_V = -430;       // px/s
  var PIPE_SPEED = 130;    // px/s

  var bird, pipes, score, pillarsSpawned, state, lastTime, groundOffset;
  var frameHandle;

  function resetGame(){
    bird = { x: 90, y: H/2, vy: 0, r: 16, wing: 0 };
    pipes = [];
    score = 0;
    pillarsSpawned = 0;
    groundOffset = 0;
    scoreDisplay.textContent = "0 m / " + TOTAL_PILLARS + " m";
    spawnInitialPipes();
  }

  function spawnPipe(){
    pillarsSpawned++;
    var isLast = pillarsSpawned === TOTAL_PILLARS;
    var margin = 60;
    var top = margin + Math.random()*(H - GROUND_H - GAP - margin*2);
    var lastX = pipes.length ? pipes[pipes.length-1].x : W;
    var x = pipes.length ? lastX + PIPE_SPACING : W + 40;
    pipes.push({ x:x, top:top, gap:GAP, passed:false, isLast:isLast, index:pillarsSpawned });
  }

  function spawnInitialPipes(){
    var x = W + 120;
    while(pillarsSpawned < TOTAL_PILLARS && (pipes.length===0 || pipes[pipes.length-1].x < W + 400)){
      spawnPipe();
    }
  }

  function startGame(){
    state = "playing";
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    winScreen.classList.add("hidden");
    flapBtn.classList.remove("hidden");
    resetGame();
    lastTime = performance.now();
    audio();
    cancelAnimationFrame(frameHandle);
    frameHandle = requestAnimationFrame(loop);
  }

  function flap(){
    if(state !== "playing") return;
    bird.vy = FLAP_V;
    bird.wing = 1;
    playFlap();
  }

  function gameOver(){
    state = "over";
    playHit();
    goStats.textContent = "Kamu terbang sejauh " + score + " m dari " + TOTAL_PILLARS + " m. Coba lagi ya!";
    gameOverScreen.classList.remove("hidden");
    flapBtn.classList.add("hidden");
  }

  function winGame(){
    state = "won";
    flapBtn.classList.add("hidden");
    winScreen.classList.remove("hidden");
    setTimeout(function(){
      winScreen.classList.add("hidden");
      container.classList.add("hidden");
      launchCelebration();
    }, 1000);
  }

  function update(dt){
    bird.vy += GRAVITY*dt;
    bird.y += bird.vy*dt;
    if(bird.wing>0) bird.wing = Math.max(0, bird.wing - dt*3);

    groundOffset = (groundOffset + PIPE_SPEED*dt) % 40;

    for(var i=0;i<pipes.length;i++){
      pipes[i].x -= PIPE_SPEED*dt;
    }
    while(pipes.length && pipes[0].x < -PIPE_W - 20){
      pipes.shift();
    }
    if(pillarsSpawned < TOTAL_PILLARS){
      var last = pipes[pipes.length-1];
      if(!last || last.x < W - PIPE_SPACING + 40){
        spawnPipe();
      }
    }

    // scoring + collision
    for(var j=0;j<pipes.length;j++){
      var p = pipes[j];
      var pipeRight = p.x + PIPE_W;

      if(!p.passed && pipeRight < bird.x){
        p.passed = true;
        score++;
        scoreDisplay.textContent = score + " m / " + TOTAL_PILLARS + " m";
        playScore();
        if(p.isLast){
          winGame();
          return;
        }
      }

      var withinX = bird.x + bird.r > p.x && bird.x - bird.r < pipeRight;
      if(withinX){
        var gapTop = p.top;
        var gapBot = p.top + p.gap;
        if(bird.y - bird.r < gapTop || bird.y + bird.r > gapBot){
          gameOver();
          return;
        }
      }
    }

    if(bird.y + bird.r > H - GROUND_H){
      bird.y = H - GROUND_H - bird.r;
      gameOver();
      return;
    }
    if(bird.y - bird.r < 0){
      bird.y = bird.r;
      bird.vy = 0;
    }
  }

  function drawCloud(x,y,s){
    ctx2d.beginPath();
    ctx2d.fillStyle = "rgba(255,255,255,.85)";
    ctx2d.arc(x,y,18*s,0,Math.PI*2);
    ctx2d.arc(x+20*s,y-8*s,14*s,0,Math.PI*2);
    ctx2d.arc(x+36*s,y,16*s,0,Math.PI*2);
    ctx2d.fill();
  }

  function drawPipe(p){
    var gapTop = p.top, gapBot = p.top + p.gap;
    ctx2d.fillStyle = "#3F8F3F";
    ctx2d.fillRect(p.x, 0, PIPE_W, gapTop);
    ctx2d.fillRect(p.x, gapBot, PIPE_W, H - GROUND_H - gapBot);
    ctx2d.fillStyle = "#5CB85C";
    ctx2d.fillRect(p.x+6, 0, PIPE_W-12, gapTop-14);
    ctx2d.fillRect(p.x+6, gapBot+14, PIPE_W-12, H - GROUND_H - gapBot - 14);
    ctx2d.fillStyle = "#3F8F3F";
    ctx2d.fillRect(p.x-4, gapTop-14, PIPE_W+8, 14);
    ctx2d.fillRect(p.x-4, gapBot, PIPE_W+8, 14);

    if(p.isLast){
      ctx2d.strokeStyle = "#8a5a2b";
      ctx2d.lineWidth = 4;
      ctx2d.beginPath();
      ctx2d.moveTo(p.x+PIPE_W/2, gapTop-14);
      ctx2d.lineTo(p.x+PIPE_W/2, gapTop-54);
      ctx2d.stroke();
      ctx2d.fillStyle = "#FF5E5E";
      ctx2d.beginPath();
      ctx2d.moveTo(p.x+PIPE_W/2, gapTop-54);
      ctx2d.lineTo(p.x+PIPE_W/2+26, gapTop-46);
      ctx2d.lineTo(p.x+PIPE_W/2, gapTop-38);
      ctx2d.closePath();
      ctx2d.fill();
    }
  }

  function drawBird(){
    ctx2d.save();
    ctx2d.translate(bird.x, bird.y);
    var angle = Math.max(-0.5, Math.min(0.9, bird.vy/500));
    ctx2d.rotate(angle);
    ctx2d.fillStyle = "#FFC93C";
    ctx2d.beginPath();
    ctx2d.ellipse(0,0, bird.r, bird.r*0.85, 0, 0, Math.PI*2);
    ctx2d.fill();
    var wingLift = -6 - bird.wing*10;
    ctx2d.fillStyle = "#E7A315";
    ctx2d.beginPath();
    ctx2d.ellipse(-4, wingLift*0.2, 9, 6, -0.3 - bird.wing*0.6, 0, Math.PI*2);
    ctx2d.fill();
    ctx2d.fillStyle = "#fff";
    ctx2d.beginPath();
    ctx2d.arc(6,-4,4.5,0,Math.PI*2);
    ctx2d.fill();
    ctx2d.fillStyle = "#22313A";
    ctx2d.beginPath();
    ctx2d.arc(7.5,-4,2.2,0,Math.PI*2);
    ctx2d.fill();
    ctx2d.fillStyle = "#FF8A3D";
    ctx2d.beginPath();
    ctx2d.moveTo(bird.r-2,-1);
    ctx2d.lineTo(bird.r+10,2);
    ctx2d.lineTo(bird.r-2,6);
    ctx2d.closePath();
    ctx2d.fill();
    ctx2d.restore();
  }

  function draw(){
    ctx2d.clearRect(0,0,W,H);
    drawCloud(W*0.2, H*0.16, 1);
    drawCloud(W*0.7, H*0.28, 0.8);
    drawCloud(W*0.45, H*0.08, 0.6);

    for(var i=0;i<pipes.length;i++) drawPipe(pipes[i]);

    ctx2d.fillStyle = "#DEB887";
    ctx2d.fillRect(0, H-GROUND_H, W, GROUND_H);
    ctx2d.fillStyle = "#B8935E";
    for(var gx=-groundOffset; gx<W; gx+=40){
      ctx2d.fillRect(gx, H-GROUND_H, 20, 8);
    }

    drawBird();
  }

  function loop(now){
    var dt = Math.min(0.033, (now - lastTime)/1000);
    lastTime = now;
    if(state === "playing"){
      update(dt);
    }
    draw();
    if(state === "playing" || state === "won"){
      frameHandle = requestAnimationFrame(loop);
    }
  }

  /* ---------- input ---------- */
  function onDown(e){
    e.preventDefault();
    if(state === "playing") flap();
  }
  flapBtn.addEventListener("pointerdown", onDown);
  window.addEventListener("keydown", function(e){
    if(e.code === "Space") { e.preventDefault(); if(state==="playing") flap(); }
  });

  startBtn.addEventListener("click", startGame);
  retryBtn.addEventListener("click", startGame);

  /* ---------- celebration ---------- */
  var confettiPieces = [];
  var confettiRunning = false;
  var colors = ["#FF6FA5","#FFC93C","#6FCBFF","#B36FFF","#6FE3A0","#FF9F6F"];

  function sizeConfetti(){
    var r = celebration.getBoundingClientRect();
    confettiCanvas.width = r.width * (window.devicePixelRatio||1);
    confettiCanvas.height = r.height * (window.devicePixelRatio||1);
    confettiCanvas.style.width = r.width+"px";
    confettiCanvas.style.height = r.height+"px";
    cctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
    return r;
  }

  function initConfetti(){
    var r = sizeConfetti();
    confettiPieces = [];
    for(var i=0;i<140;i++){
      confettiPieces.push({
        x: Math.random()*r.width,
        y: -Math.random()*r.height,
        w: 6+Math.random()*6,
        h: 8+Math.random()*8,
        vy: 60+Math.random()*90,
        vx: -40+Math.random()*80,
        rot: Math.random()*Math.PI*2,
        vr: -4+Math.random()*8,
        color: colors[i%colors.length]
      });
    }
  }

  var lastConfettiTime;
  function confettiLoop(now){
    if(!confettiRunning) return;
    var dt = Math.min(0.033,(now-(lastConfettiTime||now))/1000);
    lastConfettiTime = now;
    var r = confettiCanvas.getBoundingClientRect();
    cctx.clearRect(0,0,r.width,r.height);
    confettiPieces.forEach(function(p){
      p.y += p.vy*dt;
      p.x += p.vx*dt;
      p.rot += p.vr*dt;
      if(p.y > r.height+20){ p.y = -20; p.x = Math.random()*r.width; }
      if(p.x < -20) p.x = r.width+20;
      if(p.x > r.width+20) p.x = -20;
      cctx.save();
      cctx.translate(p.x,p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cctx.restore();
    });
    requestAnimationFrame(confettiLoop);
  }

  function launchCelebration(){
    celebration.classList.remove("hidden");
    initConfetti();
    confettiRunning = true;
    lastConfettiTime = null;
    requestAnimationFrame(confettiLoop);
    playHBD();
  }

  againBtn.addEventListener("click", function(){
    confettiRunning = false;
    celebration.classList.add("hidden");
    container.classList.remove("hidden");
    resize();
    startGame();
  });

  window.addEventListener("resize", function(){
    if(!celebration.classList.contains("hidden")) sizeConfetti();
  });

  /* ---------- init ---------- */
  resize();
  bird = { x: 90, y: (H||600)/2, vy:0, r:16, wing:0 };
  pipes = [];
  state = "idle";
  draw();
})();
</script>
</body>
</html>
